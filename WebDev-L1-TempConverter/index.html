<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThermoConvert — Temperature Converter Web App</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <main class="app-wrapper">
        <section class="converter-card" aria-labelledby="app-title">
            <header class="card-header">
                <span class="badge">OASIS INFOBYTE • Level 1 Task 3</span>
                <h1 id="app-title">Temperature Converter</h1>
                <p>Convert accurately between Celsius (°C), Fahrenheit (°F), and Kelvin (K).</p>
            </header>

            <form id="converter-form" novalidate>
                <div class="form-group">
                    <label for="temp-input">Enter Temperature Value</label>
                    <input type="text" id="temp-input" name="tempInput" placeholder="e.g., 37 or -40"
                        inputmode="decimal" autocomplete="off" required />
                    <p id="error-msg" class="error-text" role="alert" aria-live="polite"></p>
                </div>

                <div class="form-group">
                    <label for="unit-select">Input Unit</label>
                    <select id="unit-select" name="unitSelect">
                        <option value="celsius">Celsius (°C)</option>
                        <option value="fahrenheit">Fahrenheit (°F)</option>
                        <option value="kelvin">Kelvin (K)</option>
                    </select>
                </div>

                <div class="button-row">
                    <button type="submit" class="btn btn-primary">Convert</button>
                    <button type="button" id="reset-btn" class="btn btn-secondary">Reset</button>
                </div>
            </form>

            <section class="results-panel" aria-label="Converted Temperature Results">
                <h2>Converted Values</h2>
                <div class="results-grid">
                    <div class="result-box">
                        <span class="unit-label">Celsius</span>
                        <strong id="celsius-out" class="unit-value">-- °C</strong>
                    </div>
                    <div class="result-box">
                        <span class="unit-label">Fahrenheit</span>
                        <strong id="fahrenheit-out" class="unit-value">-- °F</strong>
                    </div>
                    <div class="result-box">
                        <span class="unit-label">Kelvin</span>
                        <strong id="kelvin-out" class="unit-value">-- K</strong>
                    </div>
                </div>
            </section>
        </section>

        <footer class="app-footer">
            <p>Built by Keerthika K • OIBSIP Web Development Internship</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>

</html>
